<!doctype html>
<html lang="en">
	<head>
		<!-- Applies the stored theme before first paint, so there is no flash of the
		     wrong theme. Same localStorage key and values as the main app, so a user
		     crossing app.linkio.ca → auth.linkio.ca keeps their choice. -->
		<script>
			(function () {
				const stored = localStorage.getItem('theme');
				const theme =
					stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.classList.toggle('dark', theme === 'dark');
			})();
		</script>

		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#3b82f6" />

		<!-- Icons and share image, matching the main app. Generated from the wordmark's
		     own paths, so they cannot drift from the logo. -->
		<link rel="icon" href="%sveltekit.assets%/brand/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="%sveltekit.assets%/icon-32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta property="og:title" content="Linkio" />
		<meta property="og:site_name" content="Linkio" />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="https://app.linkio.ca/og-image.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:image" content="https://app.linkio.ca/og-image.png" />

		<!-- Parkinsans is the main app's body font; load it here so the two match. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@300..800&display=swap"
			rel="stylesheet"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
